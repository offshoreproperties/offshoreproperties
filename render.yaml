# Render Blueprint — https://offshoreproperties.co.ke
services:
  - type: web
    name: offshoreproperties
    runtime: node
    plan: starter
    # Do NOT set NODE_OPTIONS in the dashboard — it caps the build heap and causes OOM.
    # Runtime memory is set in package.json "start" (--max-old-space-size=460).
    buildCommand: npm install && npm run build:render
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Add the rest in the Render dashboard (same as .env.example):
      # SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, SUPABASE_SERVICE_ROLE_KEY,
      # VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_SUPABASE_PROJECT_ID,
      # VITE_SITE_URL (https://offshoreproperties.co.ke),
      # ADMIN_PASSWORD, VITE_GOOGLE_MAPS_API_KEY, VITE_GOOGLE_MAP_ID, LOVABLE_API_KEY
