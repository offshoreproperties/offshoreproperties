<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 96" fill="none">
  <defs>
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feOffset in="blur" dx="0" dy="1" result="offsetBlur" />
      <feFlood flood-color="#ffffff" flood-opacity="0.35" result="glowColor" />
      <feComposite in="glowColor" in2="offsetBlur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <text
    x="248"
    y="66"
    text-anchor="middle"
    font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"
    font-weight="700"
    font-size="52"
    letter-spacing="-1.5"
    fill="#ffffff"
    fill-opacity="0.38"
    stroke="#ffffff"
    stroke-opacity="0.22"
    stroke-width="1.2"
    filter="url(#glass)"
  >Offshore</text>
  <circle cx="392" cy="58" r="7" fill="#2563eb" fill-opacity="0.55" />
</svg>
